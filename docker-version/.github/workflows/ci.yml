name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret hygiene
        run: |
          test ! -f .env
          test ! -d mail-server/node_modules
          test ! -d ai-agent/.pytest_cache

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install Mail Server dependencies
        working-directory: mail-server
        run: pnpm install --frozen-lockfile

      - name: Test Mail Server
        working-directory: mail-server
        run: pnpm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Agent dependencies
        working-directory: ai-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Test AI Agent
        working-directory: ai-agent
        run: python -m pytest tests
