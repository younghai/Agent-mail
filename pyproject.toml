[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Agent Mail development service dependencies for Replit"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.29.0",
    "fastapi==0.162.0",
    "httpx==0.27.0",
    "openai==1.30.0",
    "pydantic>=2.9,<3",
    "python-dotenv==1.2.4",
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "idna>=3.15,<4",
    "starlette>=1.3.1,<2",
    "python-multipart>=0.0.31",
    "tqdm>=4.66.3,<5",
    "redis[hiredis]==5.0.8",
    "uvicorn[standard]==0.30.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
