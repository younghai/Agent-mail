services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic-local-change-me}
      POSTGRES_DB: agentic_inbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mail-server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  mail-server:
    build:
      context: .
      dockerfile: mail-server/Dockerfile
    ports:
      - "127.0.0.1:5174:8080"
    environment:
      - NODE_ENV=local
      - DATABASE_URL=postgresql://agentic:${POSTGRES_PASSWORD:-agentic-local-change-me}@postgres:5432/agentic_inbox
      - REDIS_URL=redis://redis:6379
      - AI_AGENT_URL=http://ai-agent:8000
      - LOCAL_SERVICE_TOKEN=${LOCAL_SERVICE_TOKEN:-local-dev-token-change-me}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-local-admin@example.local}
      - APP_DOMAINS=${APP_DOMAINS:-bizmatrixx.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      - DEFAULT_MAILBOX_NAME=${DEFAULT_MAILBOX_NAME:-VTStirelab}
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mail-server/migrations:/app/migrations
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent:
    build: ./ai-agent
    ports:
      - "127.0.0.1:5100:8000"
    environment:
      - DATABASE_URL=postgresql://agentic:${POSTGRES_PASSWORD:-agentic-local-change-me}@postgres:5432/agentic_inbox
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - APP_ENV=${APP_ENV:-local}
      - LOCAL_SERVICE_TOKEN=${LOCAL_SERVICE_TOKEN:-local-dev-token-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_MODEL_INPUT_USD_PER_1M=${AI_MODEL_INPUT_USD_PER_1M:-0.15}
      - AI_MODEL_OUTPUT_USD_PER_1M=${AI_MODEL_OUTPUT_USD_PER_1M:-0.60}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_RATE_LIMIT_PER_MINUTE=${AI_RATE_LIMIT_PER_MINUTE:-20}
      - AI_AUTO_DRAFT_MAX_ATTEMPTS=${AI_AUTO_DRAFT_MAX_ATTEMPTS:-2}
      - AI_DLQ_STREAM=${AI_DLQ_STREAM:-email-events-dlq}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status < 500 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - CLIENT_PORT=5000
      - VITE_API_BASE_URL=http://mail-server:8080
      - VITE_LOCAL_SERVICE_TOKEN=${LOCAL_SERVICE_TOKEN:-local-dev-token-change-me}
    depends_on:
      mail-server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
